# ─────────────────────────────────────────────────────────────
# CI — runs on every push and pull request to main.
#
# What it does:
#   1. Builds the app and runs ALL 99 tests (unit + integration).
#      GitHub's Ubuntu runners have Docker, so Testcontainers can start
#      real Postgres / Redis / Kafka exactly like on your laptop.
#   2. Builds the Docker image to prove the Dockerfile still works.
#   3. If tests fail, uploads the test reports so you can see why.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # reuse downloaded dependencies between runs

      - name: Pre-pull test container images
        # Pulling in parallel up front is faster and keeps test timings stable
        run: |
          docker pull postgres:16 &
          docker pull redis:7-alpine &
          docker pull confluentinc/cp-kafka:7.6.0 &
          wait

      - name: Build and run all tests
        # tee keeps a copy of the log so the next step can quote it
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      - name: Show why it failed (on failure)
        # Turns the key error lines into a GitHub annotation, visible right
        # on the run's summary page without digging through the full log.
        if: failure()
        run: |
          lines=$(grep -E '\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|Caused by|Exception' build.log \
                  | grep -v 'Re-run Maven' | head -n 40)
          [ -z "$lines" ] && lines=$(tail -n 40 build.log)
          msg=$(printf '%s' "$lines" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build/test failure::${msg}"

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test               # only if the tests passed
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t food-delivery-backend:ci .

      - name: Smoke check — image starts and prints its Java version
        run: docker run --rm --entrypoint java food-delivery-backend:ci -version
