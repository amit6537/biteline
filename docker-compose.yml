# ─────────────────────────────────────────────────────────────
# Two ways to use this file:
#
#   docker compose up -d
#       → only the infrastructure (Postgres, Redis, Kafka, Mailpit).
#         You run the app yourself from the IDE / ./mvnw spring-boot:run.
#
#   docker compose --profile app up -d --build
#       → infrastructure + the app itself in a container (port 8080).
#         The "app" profile keeps it OFF by default so it never clashes
#         with the app you run from your IDE on the same port.
# ─────────────────────────────────────────────────────────────
services:

  # ─────────────────────────────────────────
  # The Spring Boot app (built from ./Dockerfile)
  # ─────────────────────────────────────────
  app:
    build: .
    image: food-delivery-backend:local
    container_name: fd-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # Inside Docker, services reach each other by NAME, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/fooddelivery
      DB_USERNAME: fduser
      DB_PASSWORD: fdpass
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # the in-network Kafka listener
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # Override these for anything beyond local testing:
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────
  # PostgreSQL — primary database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: fd-postgres
    environment:
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: fduser
      POSTGRES_PASSWORD: fdpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is created by Flyway when the app starts
      # (src/main/resources/db/migration), not by a Docker init script.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fduser -d fooddelivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — caching & session store
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fd-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Zookeeper — required by Kafka
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fd-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ─────────────────────────────────────────
  # Kafka — event streaming bus
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fd-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST = reachable from your laptop (localhost:9092)
      # PLAINTEXT      = reachable inside Docker network (kafka:29092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # Kafka UI — visual dashboard (localhost:8090)
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fd-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: food-delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ─────────────────────────────────────────
  # Mailpit — fake SMTP server for local dev.
  # The app sends real emails to it; open http://localhost:8025 to read them.
  # Nothing ever leaves your machine.
  # ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: fd-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox + API

volumes:
  pgdata:
  redisdata:
