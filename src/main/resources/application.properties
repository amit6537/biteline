spring.application.name=food-delivery-backend

# ─── How config works ──────────────────────────────────────────
# Every value written as ${ENV_VAR:default} reads the environment
# variable first and falls back to the default. The defaults are for
# local development only. In production, set the env vars (DB_PASSWORD,
# JWT_SECRET, ...) so no real secret ever lives in git.

# ─── Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fooddelivery}
spring.datasource.username=${DB_USERNAME:fduser}
spring.datasource.password=${DB_PASSWORD:fdpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (db/migration/V1__init_schema.sql, V2__..., ...).
# baseline-on-migrate: if a database already has tables but no Flyway
# history (e.g. created by the old Docker init script), mark it as V1
# instead of failing.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none

# Don't keep a DB connection open while the HTTP response is written.
# All our DTOs are built inside @Transactional service methods.
spring.jpa.open-in-view=false
# Load lazy relations in batches (fixes N+1 queries on order lists).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ───────────────────────────────────────────────────────
# HMAC-SHA256 key as hex (64 hex chars = 256 bits).
# Production: set JWT_SECRET. Generate one with: openssl rand -hex 32
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Access token: short (15 min) — if it leaks, it's useless soon.
# The frontend silently gets a new one from POST /api/auth/refresh.
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
# Same refresh token used twice within this many seconds = two tabs racing,
# not theft → answer 401 but don't log the session out.
app.auth.refresh-reuse-grace-seconds=10
app.auth.refresh-token-cleanup-cron=0 30 3 * * *

# ─── Rate limiting (counters live in Redis, shared by all instances) ───
# Per IP: any POST to /api/auth/login, /register, /refresh
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-ip-limit=30
app.rate-limit.auth-per-ip-window=1m
# Wrong passwords: one account from one IP, and one account from anywhere
app.rate-limit.login-fail-per-account-ip-limit=5
app.rate-limit.login-fail-per-account-ip-window=15m
app.rate-limit.login-fail-per-account-limit=20
app.rate-limit.login-fail-per-account-window=1h

# ─── CORS ────────────────────────────────────────────────────
# Browser origins allowed to call this API (comma-separated, exact match).
# Defaults = common local frontend dev servers (Vite 5173, CRA/Next 3000).
# In production set CORS_ALLOWED_ORIGINS=https://your-frontend.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── Redis ─────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# We use Redis only as a cache, never as a Spring Data repository store
spring.data.redis.repositories.enabled=false
# Fail fast: a slow/dead Redis must not make every request wait.
# (Lettuce's default command timeout is 60 SECONDS.)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# ─── Cache (Phase 9) ───────────────────────────────────────────
# Bump the version when a cached DTO changes shape → old entries are ignored
# v2: RestaurantResponse gained avgPrepMinutes (Phase 12)
app.cache.version=v2
app.cache.ttl.restaurant=PT10M
app.cache.ttl.menu=PT10M
app.cache.ttl.restaurant-list=PT1M
app.cache.ttl.unread-count=PT5M
# Redis is a cache, not a hard dependency: don't report the whole app DOWN
# (and get it restarted by Kubernetes) just because the cache is down.
management.health.redis.enabled=false
# Same for SMTP: emails go through the outbox and are retried later, so a
# mail-server outage must not mark the app DOWN either.
management.health.mail.enabled=false

# ─── Kafka ─────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=food-delivery-group
spring.kafka.consumer.auto-offset-reset=earliest

# ─── Actuator ──────────────────────────────────────────────────
# Only health + info are exposed; DB/Kafka details are hidden from
# anonymous callers.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── Logging ───────────────────────────────────────────────────
logging.level.com.fooddelivery=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO

# ─── Delivery assignment (Phase 8) ─────────────────────────────
# Only partners this close to the restaurant are considered
app.delivery.max-radius-km=${DELIVERY_MAX_RADIUS_KM:10}
# A partner who hasn't sent a location update for this long counts as offline
app.delivery.partner-stale-minutes=${DELIVERY_PARTNER_STALE_MINUTES:10}
# How often the scheduler retries READY orders that have no partner yet
app.delivery.retry-interval-ms=${DELIVERY_RETRY_INTERVAL_MS:30000}

# ─── Notifications (Phase 10) ──────────────────────────────────
app.notifications.keep-read-days=30
app.notifications.keep-any-days=90
app.notifications.cleanup-cron=0 0 3 * * *

# ─── Email (outbox + SMTP) ─────────────────────────────────────
# true = real SMTP (Mailpit locally: http://localhost:8025), false = log only
app.email.enabled=${EMAIL_ENABLED:true}
app.email.from=${EMAIL_FROM:no-reply@fooddelivery.local}
app.email.max-attempts=5
app.email.base-backoff=PT30S
app.email.dispatch-interval-ms=${EMAIL_DISPATCH_INTERVAL_MS:5000}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Never let a slow mail server hang the dispatcher
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─── Cache: delayed double delete ──────────────────────────────
app.cache.double-delete-delay-ms=1000
app.cache.heal-interval-ms=5000

# ─── Stuck orders / reject cooldown ────────────────────────────
app.delivery.reject-cooldown-minutes=${DELIVERY_REJECT_COOLDOWN_MINUTES:5}
app.delivery.stuck-alert-minutes=${DELIVERY_STUCK_ALERT_MINUTES:10}

# ─── First admin (only created if all three are set) ───────────
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.phone=${ADMIN_PHONE:}

# ─── Reviews (Phase 11) ────────────────────────────────────────
app.reviews.window-days=7
app.reviews.edit-window-hours=24

# ─── Location & ETA (Phase 12) ─────────────────────────────────
app.eta.avg-speed-kmh=20
app.eta.road-factor=1.3
app.eta.partner-search-minutes=5
app.eta.default-travel-minutes=15
app.eta.min-refresh-seconds=${ETA_MIN_REFRESH_SECONDS:30}
app.delivery.geofence.enabled=${DELIVERY_GEOFENCE_ENABLED:true}
app.delivery.geofence.pickup-radius-km=0.5
app.delivery.geofence.dropoff-radius-km=0.5
