# ─── Settings used ONLY by tests (@ActiveProfiles("test")) ─────
# Database / Redis / Kafka URLs come from Testcontainers at runtime
# (see AbstractIntegrationTest), not from here.

# Emails go to the log, no SMTP server needed
app.email.enabled=false
app.email.dispatch-interval-ms=500

# Make background jobs fast so tests don't wait 30 seconds
app.delivery.retry-interval-ms=1000
app.cache.double-delete-delay-ms=300
app.cache.heal-interval-ms=1000
app.eta.min-refresh-seconds=0

# First admin, created by AdminBootstrap
app.admin.email=admin@test.local
app.admin.password=AdminPassword123!
app.admin.phone=6000000001

logging.level.com.fooddelivery=INFO

# Every test registers users from 127.0.0.1 → the per-IP limit would trip.
# RateLimitIntegrationTest lowers it temporarily to test it.
app.rate-limit.auth-per-ip-limit=100000
