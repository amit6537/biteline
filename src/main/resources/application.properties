spring.application.name=food-delivery-backend

# ─── Database ───────────────────────────────────────────────
# WHY ddl-auto=none?
#   We control the schema ourselves via schema.sql (Phase 1).
#   Letting Hibernate auto-create tables is fine for demos but
#   dangerous in production — a typo in an entity could drop a column.
spring.datasource.url=jdbc:postgresql://localhost:5432/fooddelivery
spring.datasource.username=fduser
spring.datasource.password=fdpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ────────────────────────────────────────────────────
# WHY a long random secret?
#   JWT signatures use HMAC-SHA256. The secret must be at least
#   256 bits (32 chars). In production, store this in a vault or
#   environment variable — NEVER commit it to git.
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.access-token-expiry-ms=86400000
# 86400000 ms = 24 hours
app.jwt.refresh-token-expiry-ms=604800000
# 604800000 ms = 7 days

# ─── Redis ──────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ─── Kafka ──────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=food-delivery-group
spring.kafka.consumer.auto-offset-reset=earliest

# ─── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ────────────────────────────────────────────────
logging.level.com.fooddelivery=DEBUG
logging.level.org.springframework.security=DEBUG